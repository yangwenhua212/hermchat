name: Publish Release APK

# 用法：把签名好的 APK 放到 HxMV 实例的分发目录（~/.hxmv/dl/HxSync-<版本>.apk），
# 然后打 tag 并推送：
#     git tag v0.1.35 && git push origin v0.1.35
# 流程会从 HxMV 实例取包、校验、发 Release 并附上安装包；无论成败都把结果回传到
# HxMV 的诊断口（/hook/hxsync-release），这样在没有 Actions 日志权限时也能排障。
#
# 为什么绕这一圈：Release 资产上传必须用 token，构建机（OVH）上不放 token；
# 用仓库自带的 GITHUB_TOKEN 就够了，签名密钥也始终不进仓库。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "版本 tag（形如 v0.1.35）"
        required: true
      apk_url:
        description: "APK 下载地址（不填则按 tag 从 HxMV 实例取）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 解析版本
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VER=${TAG#v}" >> "$GITHUB_ENV"

      - name: 取安装包
        env:
          URL_OVERRIDE: ${{ github.event.inputs.apk_url }}
        run: |
          set -e
          URL="${URL_OVERRIDE:-https://hxmv.eraherm.com/dl/HxSync-${VER}.apk}"
          ASSET="HxSync-${VER}-app-release.apk"
          echo "来源：$URL"
          curl -fsSL --retry 3 --max-time 600 -o "$ASSET" "$URL"
          SIZE=$(stat -c%s "$ASSET")
          echo "大小：$SIZE 字节"
          [ "$SIZE" -ge 10000000 ] || { echo "❌ 包太小"; exit 1; }
          [ "$(head -c 2 "$ASSET")" = "PK" ] || { echo "❌ 不是 APK"; exit 1; }
          md5sum "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: 发 Release
        run: |
          set +e
          REPORT=/tmp/report.txt
          : > "$REPORT"
          echo "tag=$TAG ver=$VER asset=$ASSET size=$SIZE" >> "$REPORT"
          gh auth status >> "$REPORT" 2>&1
          gh release create "$TAG" "$ASSET" \
            --repo "${{ github.repository }}" \
            --title "HxSync ${VER}" \
            --notes "HxMV 内容生产页（设置 → HxMV 内容生产）：远端实例与手机本机两种模式，实时看分片/镜头进度与实测指标，成品可播放或存相册。详见 docs/HXMV.md。" \
            >> "$REPORT" 2>&1
          RC=$?
          echo "GH_EXIT=$RC" >> "$REPORT"
          if [ $RC -ne 0 ]; then
            echo "== 改用 REST API 试一次（主要为了拿到明确报错）==" >> "$REPORT"
            curl -sS -o /tmp/api.json -w "HTTP %{http_code}\n" -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"HxSync ${VER}\",\"body\":\"见 docs/HXMV.md\"}" \
              >> "$REPORT" 2>&1
            head -c 800 /tmp/api.json >> "$REPORT"
          fi
          echo "REPORT_START"; cat "$REPORT"; echo "REPORT_END"
          tail -c 2000 "$REPORT" > /tmp/report_tail.txt
          echo "RC=$RC" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 回传结果到 HxMV 诊断口
        if: always()
        run: |
          {
            echo "工作流结果：${RC:-unknown}"
            echo "tag=${TAG:-?} ver=${VER:-?} asset=${ASSET:-?} size=${SIZE:-?}"
            echo "--- 详细 ---"
            cat /tmp/report_tail.txt 2>/dev/null || echo "(无报告)"
          } > /tmp/report_body.txt
          curl -sS --max-time 30 -X POST --data-binary @/tmp/report_body.txt \
            -H "Content-Type: text/plain; charset=utf-8" \
            "https://hxmv.eraherm.com/hook/hxsync-release" || true
